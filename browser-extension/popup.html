<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visayatri Assistant</title>
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; margin: 0; color: #1a1a1a; }
    .header { background: #0A2E5C; color: #fff; padding: 12px 16px; font-weight: 700; }
    .body { padding: 14px 16px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; }
    button { width: 100%; background: #C89238; color: #fff; border: none; border-radius: 8px; padding: 9px; font-weight: 700; cursor: pointer; }
    button:hover { background: #b5822f; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .app-item { padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
    .app-item:hover { background: #f9fafb; }
    .muted { color: #6b7280; font-size: 11px; }
    .error { color: #991b1b; font-size: 12px; margin-top: 4px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .logout-link { color: #6b7280; font-size: 11px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">🌍 Visayatri Assistant</div>
  <div class="body" id="app-root">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
