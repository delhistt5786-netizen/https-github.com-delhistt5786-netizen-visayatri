<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visayatri Visa Services Logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C86E"/>
      <stop offset="100%" stop-color="#C89238"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3b66"/>
      <stop offset="100%" stop-color="#0A2E5C"/>
    </linearGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#12233f"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1f3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Gold ring, broken where the plane exits -->
    <circle cx="600" cy="300" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="14"
      stroke-dasharray="1140 60" stroke-dashoffset="-70" stroke-linecap="round"/>

    <!-- Dot-matrix landmass silhouette inside the ring -->
    <path fill="url(#dots)" d="
      M 520 140 C 560 120 620 115 660 135
      C 700 150 720 130 750 150 C 770 165 760 190 740 200
      C 760 220 745 245 720 240 C 730 265 705 280 685 270
      C 690 300 665 330 640 345 C 650 380 625 420 600 440
      C 585 460 560 455 555 430 C 530 445 505 430 510 400
      C 480 405 465 380 480 355 C 455 345 450 315 470 295
      C 445 280 445 250 470 235 C 450 215 460 185 490 175
      C 480 155 495 135 520 140 Z"/>

    <!-- V checkmark ribbon -->
    <path d="M 465 460 C 500 500 545 560 598 648" fill="none" stroke="url(#navyGrad)"
      stroke-width="62" stroke-linecap="round"/>
    <path d="M 598 648 C 660 540 730 300 815 145" fill="none" stroke="url(#goldGrad)"
      stroke-width="62" stroke-linecap="round"/>
    <path d="M 566 560 C 580 590 590 615 598 648 C 606 620 616 592 630 566 C 608 558 584 558 566 560 Z"
      fill="#0A2E5C" opacity="0.9"/>

    <!-- Airplane taking off through the ring -->
    <g transform="translate(795 95) rotate(-28)">
      <path d="M 0 22 L 100 22 L 74 0 L 46 0 Z" fill="#0A2E5C"/>
      <path d="M 20 24 L 92 24 L 70 46 L 34 46 Z" fill="#0A2E5C"/>
      <path d="M 40 24 L 66 24 L 90 4 L 62 4 Z" fill="#0A2E5C"/>
      <rect x="46" y="-6" width="10" height="16" rx="4" fill="#0A2E5C"/>
    </g>
  </g>

  <g transform="translate(0 700)">
    <text x="600" y="0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="8">
      <tspan fill="url(#goldGrad)">VISA</tspan><tspan fill="#0A2E5C">YATRI</tspan>
    </text>
    <g fill="url(#goldGrad)" transform="translate(0 -10)">
      <polygon points="512,18 522,32 502,32"/>
      <polygon points="680,18 690,32 670,32"/>
    </g>
    <line x1="410" y1="58" x2="555" y2="58" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
    <line x1="645" y1="58" x2="790" y2="58" stroke="url(#goldGrad)" stroke-width="4" opacity="0.9"/>
    <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="600" fill="#0A2E5C" letter-spacing="10">VISA SERVICES</text>
  </g>
</svg>
